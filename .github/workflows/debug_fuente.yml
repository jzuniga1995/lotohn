name: Debug fuente loteriasdehonduras
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: 🚀 Ejecutar scraper (sin commit)
        run: python loto_scraper.py

      - name: 🧠 Ejecutar analizador
        run: python analizador.py

      - name: 📄 Resultado
        run: |
          echo "===== resultados_hoy.json ====="
          cat resultados_hoy.json
          echo "===== historial (hoy y ayer) ====="
          python -c "import json;h=json.load(open('historial.json'));[print(f,h[f]) for f in sorted(h)[-3:]]"
