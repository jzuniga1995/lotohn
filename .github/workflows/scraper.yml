name: Scraper Loto Honduras
on:
  workflow_dispatch:
  schedule:
    # Sorteos: 11:00 AM, 3:00 PM y 9:00 PM HN (UTC-6) => 17:00, 21:00 y 03:00 UTC.
    # Corremos ~25 y ~55 min después de cada uno: el primero recoge el resultado
    # y el segundo cubre tanto el retraso de la fuente al publicar como el que
    # GitHub Actions arrastra cuando está cargado.
    - cron: '25,55 3,17,21 * * *'
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: 🎭 Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: 🚀 Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ZONE_ID:         ${{ secrets.CF_ZONE_ID }}
          CF_TOKEN:           ${{ secrets.CF_TOKEN }}
        run: |
          python loto_scraper.py
          echo "✅ Scraper ejecutado - $(date +'%Y-%m-%d %H:%M:%S UTC')"

      - name: 🧠 Run analizador
        run: |
          python analizador.py
          echo "✅ Analizador ejecutado - $(date +'%Y-%m-%d %H:%M:%S UTC')"

      - name: 📊 Check for changes
        id: verify_diff
        run: |
          git add resultados_hoy.json historial.json analisis.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit and push changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git commit -m "🧠 Análisis + resultados - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: ℹ️ No changes detected
        if: steps.verify_diff.outputs.changed != 'true'
        run: echo "ℹ️ No se detectaron cambios"
